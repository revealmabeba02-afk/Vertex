<!DOCTYPE html>
<html lang="en">
<head>
<script>
  try {
    if (localStorage.getItem("vertex-theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
    var savedAccent = localStorage.getItem("vertex-accent");
    if (savedAccent) {
      document.documentElement.setAttribute("data-accent", savedAccent);
    }
  } catch (e) {}
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0E0B12" />
<title>Log in · Vertex Chart Scanner</title>
<meta name="description" content="Log in to Vertex Chart Scanner to read forex charts with AI-powered structure and bias analysis." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://vertex-9s4c.onrender.com/login" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/site.css" />
</head>
<body>

<div class="orbs" aria-hidden="true">
  <span class="orb orb--ring orb--a"></span>
  <span class="orb orb--ring orb--b"></span>
  <span class="orb orb--blob orb--c"></span>
  <span class="orb orb--blob orb--d"></span>
  <div class="stars">
    <span class="star" style="--x:8%; --y:14%; --d:0s; --s:2.4s;"></span>
    <span class="star" style="--x:22%; --y:62%; --d:0.6s; --s:3.1s;"></span>
    <span class="star" style="--x:35%; --y:30%; --d:1.1s; --s:2.8s;"></span>
    <span class="star" style="--x:48%; --y:80%; --d:0.3s; --s:3.6s;"></span>
    <span class="star" style="--x:58%; --y:18%; --d:1.6s; --s:2.5s;"></span>
    <span class="star" style="--x:67%; --y:52%; --d:0.9s; --s:3.3s;"></span>
    <span class="star" style="--x:78%; --y:8%; --d:0.2s; --s:2.9s;"></span>
    <span class="star" style="--x:85%; --y:70%; --d:1.4s; --s:3.4s;"></span>
    <span class="star" style="--x:12%; --y:88%; --d:0.8s; --s:2.6s;"></span>
    <span class="star" style="--x:92%; --y:40%; --d:1.9s; --s:3.0s;"></span>
  </div>
</div>

<header class="topbar">
  <div class="topbar__pill">
    <a class="brand" href="/" aria-label="Vertex Chart Scanner home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3.5" y="14" width="2.6" height="6" rx="0.6" fill="#3FBF8A"/><line x1="4.8" y1="12.5" x2="4.8" y2="21" stroke="#3FBF8A" stroke-width="1"/>   <rect x="8.2" y="10.5" width="2.6" height="7.5" rx="0.6" fill="#3FBF8A"/><line x1="9.5" y1="9" x2="9.5" y2="19" stroke="#3FBF8A" stroke-width="1"/>   <rect x="12.9" y="6.5" width="2.6" height="8.5" rx="0.6" fill="#3FBF8A"/><line x1="14.2" y1="5" x2="14.2" y2="16" stroke="#3FBF8A" stroke-width="1"/>   <rect x="17.6" y="3" width="2.6" height="8" rx="0.6" fill="#3FBF8A"/><line x1="18.9" y1="1.5" x2="18.9" y2="12" stroke="#3FBF8A" stroke-width="1"/>   <line x1="3" y1="20.5" x2="21" y2="2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand__name">Vertex Scanner</span>
    </a>
    <div class="topbar__actions">
      <a class="btn btn--ghost" href="/signup">Sign up</a>
    </div>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <h1 class="auth-card__title">Welcome back</h1>
    <p class="auth-card__lede">Log in to scan your charts.</p>

    <p class="auth-alert auth-alert--info" id="setup-alert" hidden>Accounts are not connected yet. Add the Supabase keys to <code>server/.env</code> and restart, see SUPABASE_SETUP.md.</p>
    <p class="auth-alert auth-alert--error" id="form-alert" role="alert" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com" />
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="field__wrap">
          <input class="input input--pw" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" />
          <button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <button type="submit" class="scan-btn" id="submit-btn">
        <span class="scan-btn__label">Log in</span>
        <span class="scan-btn__spinner" aria-hidden="true"></span>
      </button>
    </form>

    <p class="auth-switch">New here? <a href="/signup" id="signup-link">Create an account</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/auth-client.js"></script>
<script src="/auth-pages.js"></script>
<script>
  (async () => {
    const { Auth } = window;
    const next = Auth.safeNext(new URLSearchParams(location.search).get("next"));
    document.getElementById("signup-link").href = "/signup" + location.search;

    if (!AuthPage.guardSetup()) return;
    if (await Auth.getSession()) return location.replace(next);

    const form = document.getElementById("login-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      AuthPage.clearError();

      if (!email.value.trim() || !password.value) {
        return AuthPage.showError("Enter your email and password.", !email.value.trim() ? email : password);
      }

      AuthPage.setBusy(true);
      const { error } = await Auth.client.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });
      AuthPage.setBusy(false);

      if (error) return AuthPage.showError(Auth.friendlyError(error), password);
      location.replace(next);
    });
  })();
</script>
</body>
</html>
