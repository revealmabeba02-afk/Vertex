<!DOCTYPE html>
<html lang="en">
<head>
<script>
  try {
    if (localStorage.getItem("vertex-theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
    var savedAccent = localStorage.getItem("vertex-accent");
    if (savedAccent) {
      document.documentElement.setAttribute("data-accent", savedAccent);
    }
  } catch (e) {}
</script>
<meta charset="UTF-8" />

<meta name="theme-color" content="#0E0B12" />
<title>Set a new password · Vertex Chart Scanner</title>
<meta name="description" content="Set a new password for your Vertex Chart Scanner account." />
<meta name="robots" content="noindex, follow" />

<body>

<div class="orbs" aria-hidden="true">
  <span class="orb orb--ring orb--a"></span>
  <span class="orb orb--ring orb--b"></span>
  <span class="orb orb--blob orb--c"></span>
  <span class="orb orb--blob orb--d"></span>
</div>

<header class="topbar">
  <div class="topbar__pill">
    <a class="brand" href="/" aria-label="Vertex Chart Scanner home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 200 200" width="20" height="20">
          <defs>
            <linearGradient id="vb-ring-up" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EAFBF2"/><stop offset="35%" stop-color="#4FE3A0"/><stop offset="70%" stop-color="#1E7A52"/><stop offset="100%" stop-color="#4FE3A0"/></linearGradient>
            <linearGradient id="vb-silver-up" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="45%" stop-color="#D7DEE0"/><stop offset="60%" stop-color="#8E9A9D"/><stop offset="100%" stop-color="#C7D1D3"/></linearGradient>
            <linearGradient id="vb-green-up" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B9FBDB"/><stop offset="35%" stop-color="#4FE3A0"/><stop offset="75%" stop-color="#17A76B"/><stop offset="100%" stop-color="#0C7C4F"/></linearGradient>
            <linearGradient id="vb-sheen-up" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/><stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
            <radialGradient id="vb-bg-up" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#121A17"/><stop offset="100%" stop-color="#020503"/></radialGradient>
            <clipPath id="vb-clip-up"><rect x="6" y="6" width="188" height="188" rx="42"/></clipPath>
          </defs>
          <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#vb-bg-up)"/>
          <rect x="6" y="6" width="188" height="188" rx="42" fill="none" stroke="url(#vb-ring-up)" stroke-width="6"/>
          <g clip-path="url(#vb-clip-up)">
            <path d="M -10 40 L 90 -10 L 220 -10 L 20 120 Z" fill="url(#vb-sheen-up)" opacity="0.55"/>
            <path d="M56,50 L100,152" fill="none" stroke="url(#vb-silver-up)" stroke-width="24" stroke-linecap="round"/>
            <path d="M100,152 L144,50" fill="none" stroke="url(#vb-green-up)" stroke-width="24" stroke-linecap="round"/>
          </g>
        </svg>
      </span>
      <span class="brand__name">Vertex Scanner</span>
    </a>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <h1 class="auth-card__title">Set a new password</h1>
    <p class="auth-card__lede" id="lede-text">Choose a new password for your account.</p>

    <p class="auth-alert auth-alert--info" id="setup-alert" hidden>Accounts are not connected yet. Add the Supabase keys to <code>server/.env</code> and restart, see SUPABASE_SETUP.md.</p>
    <p class="auth-alert auth-alert--error" id="form-alert" role="alert" hidden></p>
    <p class="auth-alert auth-alert--error" id="expired-alert" hidden>This reset link is invalid or has expired. <a href="/forgot-password">Request a new one</a>.</p>

    <form id="update-form" novalidate>
      <div class="field">
        <label class="field__label" for="password">New password</label>
        <div class="field__wrap">
          <input class="input input--pw" id="password" name="password" type="password" autocomplete="new-password" required placeholder="At least 8 characters" />
          <button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password">Show</button>
        </div>
      </div>

      <button type="submit" class="scan-btn" id="submit-btn">
        <span class="scan-btn__label">Update password</span>
        <span class="scan-btn__spinner" aria-hidden="true"></span>
      </button>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/auth-client.js"></script>
<script src="/auth-pages.js"></script>
<script>
  (async () => {
    const { Auth } = window;
    if (!AuthPage.guardSetup()) return;

    const form = document.getElementById("update-form");
    const password = document.getElementById("password");
    const expiredAlert = document.getElementById("expired-alert");

    // Supabase's reset link puts the recovery session in the URL hash and
    // supabase-js (detectSessionInUrl: true) turns it into a real session on
    // load. If that didn't happen, the link was bad or already used.
    let hasRecoverySession = Boolean(await Auth.getSession());
    if (!hasRecoverySession) {
      // detectSessionInUrl can take a tick after a fresh page load.
      await new Promise((r) => setTimeout(r, 400));
      hasRecoverySession = Boolean(await Auth.getSession());
    }
    if (!hasRecoverySession) {
      expiredAlert.hidden = false;
      form.querySelectorAll("input, button").forEach((el) => { el.disabled = true; });
      return;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      AuthPage.clearError();

      if (!password.value || password.value.length < 8) {
        return AuthPage.showError("Password must be at least 8 characters.", password);
      }

      AuthPage.setBusy(true);
      const { error } = await Auth.client.auth.updateUser({ password: password.value });
      AuthPage.setBusy(false);

      if (error) return AuthPage.showError(Auth.friendlyError(error), password);

      // Password changed — sign this recovery session out and send them to
      // log in fresh with the new password, rather than silently continuing
      // into the app on a session nobody typed a password for just now.
      await Auth.clearSession();
      location.href = "/login?reset=1";
    });
  })();
</script>
</body>
</html>
