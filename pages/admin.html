<!DOCTYPE html>
<html lang="en">
<head>
<script>
  try {
    if (localStorage.getItem("vertex-theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
    var savedAccent = localStorage.getItem("vertex-accent");
    if (savedAccent) {
      document.documentElement.setAttribute("data-accent", savedAccent);
    }
  } catch (e) {}
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0E0B12" />
<title>Admin · Vertex Chart Scanner</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/site.css" />
<style>
  .admin-wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: clamp(40px, 8vh, 80px) clamp(16px, 4vw, 40px) 64px;
  }
  .admin-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 28px;
  }
  .stat-card {
    padding: 20px 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--panel) 65%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .stat-card__label {
    font-size: 12.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stat-card__value {
    margin-top: 8px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 32px;
    color: var(--text);
  }
  .admin-status {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-faint);
  }
  .admin-status--error { color: var(--bear); }

  .users-card {
    margin-top: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--panel) 65%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }
  .users-card__head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border-soft);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }
  .users-table-wrap { overflow-x: auto; }
  .users-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    white-space: nowrap;
  }
  .users-table th {
    text-align: left;
    padding: 10px 22px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border-soft);
  }
  .users-table td {
    padding: 12px 22px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text-dim);
  }
  .users-table tr:last-child td { border-bottom: 0; }
  .users-table td.users-table__name { color: var(--text); font-weight: 600; }
  .users-table td.users-table__paid { color: var(--text-faint); }
  .users-empty {
    padding: 28px 22px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
  }
</style>
</head>
<body>

<div class="orbs" aria-hidden="true">
  <span class="orb orb--ring orb--a"></span>
  <span class="orb orb--ring orb--b"></span>
  <span class="orb orb--blob orb--c"></span>
  <span class="orb orb--blob orb--d"></span>
  <div class="stars">
    <span class="star" style="--x:8%; --y:14%; --d:0s; --s:2.4s;"></span>
    <span class="star" style="--x:22%; --y:62%; --d:0.6s; --s:3.1s;"></span>
    <span class="star" style="--x:35%; --y:30%; --d:1.1s; --s:2.8s;"></span>
    <span class="star" style="--x:48%; --y:80%; --d:0.3s; --s:3.6s;"></span>
    <span class="star" style="--x:58%; --y:18%; --d:1.6s; --s:2.5s;"></span>
    <span class="star" style="--x:67%; --y:52%; --d:0.9s; --s:3.3s;"></span>
    <span class="star" style="--x:78%; --y:8%; --d:0.2s; --s:2.9s;"></span>
    <span class="star" style="--x:85%; --y:70%; --d:1.4s; --s:3.4s;"></span>
    <span class="star" style="--x:12%; --y:88%; --d:0.8s; --s:2.6s;"></span>
    <span class="star" style="--x:92%; --y:40%; --d:1.9s; --s:3.0s;"></span>
  </div>
</div>

<header class="topbar">
  <div class="topbar__pill">
    <a class="brand" href="/" aria-label="Vertex Chart Scanner home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3.5" y="14" width="2.6" height="6" rx="0.6" fill="#3FBF8A"/><line x1="4.8" y1="12.5" x2="4.8" y2="21" stroke="#3FBF8A" stroke-width="1"/>   <rect x="8.2" y="10.5" width="2.6" height="7.5" rx="0.6" fill="#3FBF8A"/><line x1="9.5" y1="9" x2="9.5" y2="19" stroke="#3FBF8A" stroke-width="1"/>   <rect x="12.9" y="6.5" width="2.6" height="8.5" rx="0.6" fill="#3FBF8A"/><line x1="14.2" y1="5" x2="14.2" y2="16" stroke="#3FBF8A" stroke-width="1"/>   <rect x="17.6" y="3" width="2.6" height="8" rx="0.6" fill="#3FBF8A"/><line x1="18.9" y1="1.5" x2="18.9" y2="12" stroke="#3FBF8A" stroke-width="1"/>   <line x1="3" y1="20.5" x2="21" y2="2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="brand__name">Vertex AI</span>
    </a>
    <div class="topbar__actions">
      <a class="btn btn--ghost" href="/app">Back to scanner</a>
    </div>
  </div>
</header>

<main class="admin-wrap">
  <p class="eyebrow">
    <span class="eyebrow__dot" aria-hidden="true"></span>
    Admin
  </p>
  <h1 class="hero__title" style="font-size: clamp(28px, 4vw, 38px);">Vertex AI</h1>
  <p class="hero__lede" style="margin-bottom: 0;">Only you can see this page.</p>

  <div class="admin-stats">
    <div class="stat-card">
      <div class="stat-card__label">Total signed-up users</div>
      <div class="stat-card__value" id="stat-users">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-card__label">Paying users</div>
      <div class="stat-card__value" id="stat-paid">—</div>
    </div>
  </div>

  <p class="admin-status" id="admin-status">Loading…</p>

  <div class="users-card">
    <div class="users-card__head">Users</div>
    <div class="users-table-wrap">
      <table class="users-table" id="users-table" hidden>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Joined</th>
            <th>Last active</th>
            <th>Paid</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div class="users-empty" id="users-empty">Loading…</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script src="/auth-client.js"></script>
<script>
  (async () => {
    const { Auth } = window;
    const statusEl = document.getElementById("admin-status");
    const statUsersEl = document.getElementById("stat-users");
    const statPaidEl = document.getElementById("stat-paid");
    const tableEl = document.getElementById("users-table");
    const tbodyEl = document.getElementById("users-tbody");
    const emptyEl = document.getElementById("users-empty");

    function fmtDate(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      } catch {
        return "—";
      }
    }

    const session = await Auth.getSession();
    if (!session) {
      location.replace("/login?next=/admin");
      return;
    }
    const authHeader = { Authorization: `Bearer ${session.access_token}` };

    // Paying users are always "—" for now: there is no payment system yet
    // (that's next). Once it exists, this page gets wired up to show it.
    statPaidEl.textContent = "—";

    try {
      const [statsRes, usersRes] = await Promise.all([
        fetch("/api/admin/stats", { headers: authHeader }),
        fetch("/api/admin/users", { headers: authHeader })
      ]);

      if (statsRes.status === 403 || usersRes.status === 403) {
        statusEl.textContent = "Not authorized.";
        statusEl.classList.add("admin-status--error");
        emptyEl.textContent = "Not authorized.";
        return;
      }

      const statsData = await statsRes.json().catch(() => null);
      if (statsRes.ok && statsData && typeof statsData.totalUsers === "number") {
        statUsersEl.textContent = String(statsData.totalUsers);
      } else {
        statUsersEl.textContent = "—";
      }

      const usersData = await usersRes.json().catch(() => null);
      const users = usersData && Array.isArray(usersData.users) ? usersData.users : [];

      if (!usersRes.ok) {
        statusEl.textContent = (usersData && usersData.error) || "Could not load users.";
        statusEl.classList.add("admin-status--error");
        emptyEl.textContent = "Could not load users.";
        return;
      }

      if (users.length === 0) {
        emptyEl.textContent = "No users yet.";
      } else {
        tbodyEl.innerHTML = "";
        users.forEach((u) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="users-table__name">${u.full_name ? escapeHtml(u.full_name) : "—"}</td>
            <td>${escapeHtml(u.email || "—")}</td>
            <td>${fmtDate(u.created_at)}</td>
            <td>${fmtDate(u.last_sign_in_at)}</td>
            <td class="users-table__paid">—</td>
          `;
          tbodyEl.appendChild(tr);
        });
        tableEl.hidden = false;
        emptyEl.hidden = true;
      }

      statusEl.textContent = "Updated just now.";
    } catch {
      statusEl.textContent = "Could not reach the server. Try again.";
      statusEl.classList.add("admin-status--error");
      emptyEl.textContent = "Could not reach the server.";
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  })();
</script>
</body>
</html>
