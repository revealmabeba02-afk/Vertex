<svg width="640" height="700" viewBox="0 0 640 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C874"/><stop offset="55%" stop-color="#E8A840"/><stop offset="100%" stop-color="#C98A2A"/>
    </linearGradient>
    <linearGradient id="candleGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7EE0B8"/><stop offset="100%" stop-color="#3FBF8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A840" stop-opacity="0.28"/><stop offset="100%" stop-color="#E8A840" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C874" stop-opacity="0.05"/><stop offset="45%" stop-color="#F4C874" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#F4C874" stop-opacity="0.85"/><stop offset="100%" stop-color="#F4C874" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="700" fill="#0E0B12"/>
  <circle cx="320" cy="290" r="195" fill="url(#glow)"/>
  <circle cx="320" cy="290" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="5" filter="url(#softGlow)"/>
  <circle cx="320" cy="290" r="200" fill="none" stroke="#0E0B12" stroke-width="1"/>
  <g>
