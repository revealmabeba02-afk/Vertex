    <rect x="232" y="370" width="18" height="70" rx="2" fill="url(#candleGrad)"/><line x1="241" y1="352" x2="241" y2="450" stroke="#3FBF8A" stroke-width="3"/>
    <rect x="278" y="330" width="18" height="72" rx="2" fill="#8A8199"/><line x1="287" y1="314" x2="287" y2="412" stroke="#8A8199" stroke-width="3"/>
